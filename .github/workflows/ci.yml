name: verify

on:
  push:
    branches: [main]
  pull_request:

# The README, the decision records, .dependency-cruiser.mjs and calc-version.ts
# all claim these checks run in CI. This file is what makes that true.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-calc-version.sh diffs against the merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs, in order: the architecture guards that assert the lint config has
      # not been detached, then typecheck (src AND tests), lint, tests, and the
      # dependency graph.
      - name: Verify
        run: pnpm run verify

      # The deploy applies migrations on its own, so the failure this catches is
      # not a forgotten RUN — it is a forgotten GENERATE. That one is silent:
      # every migration applies cleanly and the service comes up against a
      # database missing the column the code was just taught to read.
      - name: Every schema change has a migration
        run: ./scripts/check-migrations.sh

      # A SEPARATE step so the summary says "coverage" rather than "tests" when
      # this is what failed. The thresholds live in vitest.config.ts and the
      # command exits non-zero below them, so a release cannot go out under 99%.
      - name: Unit test coverage (blocks below 99%)
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: CALC_VERSION guard
        run: ./scripts/check-calc-version.sh
